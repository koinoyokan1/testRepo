version: '3.8'

services:
  # Prebuilt images - services using official images
  nginx:
    image: nginx:1.21.6
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    # Used by: services/web-frontend, services/admin-dashboard
    # Owner: platform-team@company.com
    # CVE: CVE-2026-NGINX-001 (HIGH) - Fix: 1.25.4

  postgres:
    image: postgres:13.23
    container_name: postgres-db
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    # Used by: services/auth, services/users, services/payment
    # Owner: database-team@company.com
    # CVE: CVE-2026-PG-001 (CRITICAL) - Fix: 16.2

  redis:
    image: redis:6.0.20
    container_name: redis-cache
    ports:
      - "6379:6379"
    # Used by: services/api-gateway, services/auth
    # Owner: platform-team@company.com

  # Custom built services
  api-gateway:
    image: ghcr.io/company/api-gateway:v2.3.1
    container_name: api-gateway
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    # Base: golang:1.19.0-alpine
    # Owner: alice@company.com
    # CVE: CVE-2026-API-001 (CRITICAL) - Fix: v2.4.0

  auth-service:
    image: ghcr.io/company/auth-service:v1.5.2
    container_name: auth-service
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    # Base: golang:1.19.0-alpine
    # Owner: david@company.com

  user-service:
    image: ghcr.io/company/user-service:v1.8.0
    container_name: user-service
    build:
      context: ./services/users
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    # Base: golang:1.19.0-alpine
    # Owner: frank@company.com
    # CVE: CVE-2026-USER-001 (HIGH) - Fix: v1.9.0

  web-frontend:
    image: ghcr.io/company/web-frontend:v3.2.0
    container_name: web-frontend
    build:
      context: ./services/web-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    # Base: node:16.14.0-alpine
    # Owner: xavier@company.com

  admin-dashboard:
    image: ghcr.io/company/admin-dashboard:v2.1.5
    container_name: admin-dashboard
    build:
      context: ./services/admin-dashboard
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    # Base: node:16.14.0-alpine
    # Owner: zoe@company.com
