name: Renovate

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - info
          - warn
          - error
  push:
    branches:
      - main
    paths:
      - '.github/workflows/renovate.yml'
      - 'renovate.json'
      - 'security-tooling/blackduck_report.json'
      - 'security-tooling/renovate.json'
      - 'security-tooling/generate_*.py'
      - 'security-tooling/detect_*.py'
      - 'security-tooling/patch_*.py'
      - 'security-tooling/create_*.py'
      - 'security-tooling/scan_*.py'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Renovate rules from Black Duck findings
        id: blackduck
        run: |
          echo "Processing Black Duck vulnerability reports..."

          # Check if Black Duck report exists
          if [ -f "security-tooling/blackduck_report.json" ]; then
            echo "Found Black Duck vulnerability report"

            # Generate dynamic Renovate rules for packages (go/npm)
            python3 security-tooling/generate_renovate_rules.py

            # Generate dynamic Renovate rules for container images
            python3 security-tooling/scan_container_images.py

            # Generate dynamic Renovate rules for OS-level packages in Dockerfiles
            python3 security-tooling/generate_dockerfile_rules.py

            # NEW: Detect and patch base image vulnerabilities
            echo "Detecting base image vulnerabilities..."
            python3 security-tooling/detect_base_image_vulns.py

            if [ -f "security-tooling/generated/vuln-categorization.json" ]; then
              base_image_count=$(python3 -c "import json; data=json.load(open('security-tooling/generated/vuln-categorization.json')); print(len(data.get('base_image_vulns', [])))")

              if [ "$base_image_count" -gt "0" ]; then
                echo "Found $base_image_count base image vulnerability(ies)"
                echo "Patching Dockerfiles..."
                python3 security-tooling/patch_base_image_dockerfiles.py

                echo "Generating Renovate regex for base image upgrades..."
                python3 security-tooling/generate_upgrade_regex.py
              else
                echo "No base image vulnerabilities found"
              fi
            fi

            # Generate GitHub Issues for unfixable vulnerabilities
            python3 security-tooling/create_github_issues.py

            # Generate reviewer assignments based on component ownership
            python3 security-tooling/manage_reviewers.py generate-renovate

            # Generate package rules for container base images with reviewers
            python3 security-tooling/generate_base_image_rules.py

            # Merge generated rules with base renovate.json
            if [ -f "security-tooling/generated/renovate-blackduck-generated.json" ]; then
              echo "Successfully generated security-tooling/generated/renovate-blackduck-generated.json"

              # Create a merged config that extends both base and generated rules
              cat > renovate-merged.json << 'EOF'
          {
            "$schema": "https://docs.renovatebot.com/renovate-schema.json",
            "extends": [
              "config:base"
            ],
            "description": "Renovate configuration with Black Duck vulnerability remediation ONLY",
            "dependencyDashboard": true,
            "dependencyDashboardAutoclose": false,
            "enabledManagers": ["gomod", "npm", "docker-compose", "dockerfile", "regex"],
            "prHourlyLimit": 0,
            "prConcurrentLimit": 0,
            "branchConcurrentLimit": 0,
            "separateMinorPatch": true,
            "separateMultipleMajor": true,
            "separateMajorMinor": true,
            "rangeStrategy": "update-lockfile",
            "semanticCommits": "enabled",
            "commitMessagePrefix": "fix(deps):",
            "commitMessageTopic": "{{depName}}",
            "commitMessageExtra": "to {{#if isMajor}}v{{{newMajor}}}{{else}}{{#if isSingleVersion}}v{{{newVersion}}}{{else}}{{{newValue}}}{{/if}}{{/if}}",
            "labels": [
              "dependencies",
              "security"
            ],
            "assignees": [],
            "reviewers": [],
            "vulnerabilityAlerts": {
              "enabled": false
            },
            "packageRules": []
          }
          EOF

              # Merge package rules from generated configs into merged config
              python3 << 'PYTHON'
          import json
          import os

          # Read base merged config
          with open('renovate-merged.json') as f:
              merged = json.load(f)

          # Read generated Black Duck rules for packages (go/npm)
          with open('security-tooling/generated/renovate-blackduck-generated.json') as f:
              blackduck_rules = json.load(f)

          # Read generated Black Duck rules for container images
          container_rules = {}
          try:
              with open('security-tooling/generated/renovate-container-images.json') as f:
                  container_rules = json.load(f)
                  print(f"✓ Found {len(container_rules.get('packageRules', []))} container image rules")
          except FileNotFoundError:
              print("⚠ No container image rules found, skipping")

          # Read generated Dockerfile OS-level package rules
          dockerfile_rules = {}
          try:
              with open('security-tooling/generated/renovate-dockerfile-regex.json') as f:
                  dockerfile_rules = json.load(f)
                  print(f"✓ Found {len(dockerfile_rules.get('regexManagers', []))} Dockerfile regex managers")
                  print(f"✓ Found {len(dockerfile_rules.get('packageRules', []))} Dockerfile package rules")
          except FileNotFoundError:
              print("⚠ No Dockerfile rules found, skipping")

          # Read generated base image upgrade rules
          base_image_upgrade_rules = {}
          try:
              with open('security-tooling/generated/renovate-base-image-upgrades.json') as f:
                  base_image_upgrade_rules = json.load(f)
                  print(f"✓ Found {len(base_image_upgrade_rules.get('regexManagers', []))} base image upgrade regex managers")
                  print(f"✓ Found {len(base_image_upgrade_rules.get('packageRules', []))} base image upgrade package rules")
          except FileNotFoundError:
              print("⚠ No base image upgrade rules found, skipping")

          # Read generated container base image rules (with reviewers)
          base_image_rules = {}
          try:
              with open('security-tooling/generated/renovate-base-image-rules.json') as f:
                  base_image_rules = json.load(f)
                  print(f"✓ Found {len(base_image_rules.get('packageRules', []))} base image rules with reviewers")
          except FileNotFoundError:
              print("⚠ No base image rules found, skipping")

          # Read generated reviewer assignments
          reviewer_rules = {}
          try:
              with open('security-tooling/generated/renovate-reviewers.json') as f:
                  reviewer_config = json.load(f)
                  # Create a map of package name to reviewer rule
                  for rule in reviewer_config.get('packageRules', []):
                      for pkg in rule.get('matchPackageNames', []):
                          reviewer_rules[pkg] = rule
          except FileNotFoundError:
              print("⚠ No reviewer config found, skipping reviewer assignment")

          # Merge Black Duck package rules with reviewer assignments
          final_rules = []
          for bd_rule in blackduck_rules.get('packageRules', []):
              # Get package name from rule
              pkg_names = bd_rule.get('matchPackageNames', [])

              # Merge with reviewer rule if exists
              for pkg_name in pkg_names:
                  if pkg_name in reviewer_rules:
                      rev_rule = reviewer_rules[pkg_name]
                      # Merge reviewers and labels
                      bd_rule['reviewers'] = rev_rule.get('reviewers', [])
                      bd_rule['addLabels'] = bd_rule.get('labels', []) + rev_rule.get('addLabels', [])

                      # Add component owners to PR body notes
                      if 'prBodyNotes' in bd_rule and rev_rule.get('reviewers'):
                          owners_section = [
                              "",
                              "---",
                              "",
                              "### 👥 Component Owners",
                              ""
                          ]
                          for reviewer in rev_rule.get('reviewers', []):
                              owners_section.append(f"- @{reviewer.replace('@company.com', '')}")

                          # Add component labels info
                          if rev_rule.get('addLabels'):
                              components = [lbl.replace('component:', '') for lbl in rev_rule.get('addLabels', []) if lbl.startswith('component:')]
                              if components:
                                  owners_section.append("")
                                  owners_section.append(f"**Affected Components**: {', '.join(components)}")

                          # Insert before the "This PR was created..." line
                          bd_rule['prBodyNotes'] = bd_rule['prBodyNotes'][:-1] + owners_section + [bd_rule['prBodyNotes'][-1]]

              final_rules.append(bd_rule)

          # Add container image rules (these already have reviewers from scan_container_images.py)
          final_rules.extend(container_rules.get('packageRules', []))

          # Add Dockerfile OS-level package rules (these already have reviewers from generate_dockerfile_rules.py)
          final_rules.extend(dockerfile_rules.get('packageRules', []))

          # Add base image upgrade package rules (these already have reviewers from generate_upgrade_regex.py)
          final_rules.extend(base_image_upgrade_rules.get('packageRules', []))

          # Add container base image rules with reviewers
          final_rules.extend(base_image_rules.get('packageRules', []))

          # Merge Dockerfile regex managers into base config
          if dockerfile_rules.get('regexManagers'):
              if 'regexManagers' not in merged:
                  merged['regexManagers'] = []
              merged['regexManagers'].extend(dockerfile_rules.get('regexManagers', []))

          # Merge base image upgrade regex managers into base config
          if base_image_upgrade_rules.get('regexManagers'):
              if 'regexManagers' not in merged:
                  merged['regexManagers'] = []
              merged['regexManagers'].extend(base_image_upgrade_rules.get('regexManagers', []))

          # Add the global disable rule FIRST
          merged['packageRules'].append({
              "description": "Disable all updates by default - only Black Duck findings will be enabled",
              "matchPackagePatterns": ["*"],
              "matchManagers": ["gomod", "npm"],
              "enabled": False
          })

          # Add merged package rules AFTER the disable rule
          # In Renovate, the last matching rule wins, so enable rules override the disable
          merged['packageRules'].extend(final_rules)

          # Write merged config
          with open('renovate-merged.json', 'w') as f:
              json.dump(merged, f, indent=2)

          print("✓ Merged Black Duck rules and reviewer assignments into Renovate configuration")
          print(f"✓ Total package rules: {len(merged['packageRules'])}")
          print(f"  - Package rules (go/npm): {len(blackduck_rules.get('packageRules', []))}")
          print(f"  - Container image rules: {len(container_rules.get('packageRules', []))}")
          print(f"  - Dockerfile OS-level rules: {len(dockerfile_rules.get('packageRules', []))}")
          print(f"  - Base image upgrade rules: {len(base_image_upgrade_rules.get('packageRules', []))}")
          print(f"✓ Total regex managers: {len(merged.get('regexManagers', []))}")

          # Print full merged config for debugging
          print("\n" + "="*80)
          print("RENOVATE MERGED CONFIGURATION (renovate-merged.json)")
          print("="*80)
          print(json.dumps(merged, indent=2))
          print("="*80 + "\n")
          PYTHON

              echo "Using merged configuration with dynamic Black Duck rules"
            else
              echo "Warning: Failed to generate Black Duck rules, using base renovate.json"
              cp renovate.json renovate-merged.json
            fi

            # Create GitHub Issues for unfixable vulnerabilities
            if [ -f "security-tooling/generated/github-issues.sh" ]; then
              echo "Creating GitHub Issues for unfixable vulnerabilities..."

              # Check if there are any unfixable vulnerabilities
              if [ -f "security-tooling/generated/unfixable-vulnerabilities.json" ]; then
                unfixable_count=$(jq -r '.unfixable_count' security-tooling/generated/unfixable-vulnerabilities.json)

                if [ "$unfixable_count" -gt 0 ]; then
                  echo "Found $unfixable_count unfixable vulnerability(ies)"

                  # Run the GitHub issue creation script
                  bash security-tooling/generated/github-issues.sh || {
                    echo "⚠️ Warning: Some GitHub issues may have failed to create"
                  }

                  echo "✅ Completed GitHub Issue creation for unfixable vulnerabilities"
                else
                  echo "✅ No unfixable vulnerabilities to create issues for"
                fi
              fi
            fi
          else
            echo "No Black Duck report found, using base renovate.json"
            cp renovate.json renovate-merged.json
          fi

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v40.3.2
        with:
          configurationFile: renovate-merged.json
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'debug' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
